<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AGY Remote" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <title>Antigravity Remote Control</title>
  <style>
    :root {
      --bg-primary: #0b0e14;
      --bg-secondary: #121722;
      --bg-card: #181f2e;
      --bg-elevated: #20293d;
      --border: rgba(148, 163, 184, 0.14);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --green: #10b981;
      --orange: #f59e0b;
      --red: #ef4444;
      --purple: #8b5cf6;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--bg-primary);
      color: var(--text-main);
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航栏 */
    .topbar {
      padding-top: calc(var(--safe-top) + 8px);
      padding-bottom: 10px;
      padding-left: 14px;
      padding-right: 14px;
      background: rgba(18, 23, 34, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      z-index: 30;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
    }

    .title-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .convo-title {
      font-size: 14.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .net-subtitle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .status-dot.blue {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .status-dot.offline {
      background: var(--red);
      box-shadow: none;
    }

    .model-select {
      background: var(--bg-card);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.35);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 11.5px;
      font-weight: 500;
      max-width: 138px;
      outline: none;
    }

    /* 侧边抽屉 (项目与会话列表) */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 82vw;
      max-width: 320px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      z-index: 60;
      transform: translateX(-102%);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      padding-top: calc(var(--safe-top) + 12px);
      padding-bottom: calc(var(--safe-bottom) + 12px);
    }
    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 0 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-new-chat {
      margin: 12px 14px;
      padding: 11px 14px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff;
      border: none;
      font-weight: 600;
      font-size: 13.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    .project-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px;
    }

    .project-group {
      margin-bottom: 14px;
    }

    .project-name {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-sub);
      padding: 4px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .convo-item {
      padding: 10px 10px;
      border-radius: 9px;
      margin-top: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #cbd5e1;
      font-size: 13.5px;
    }
    .convo-item.active {
      background: var(--accent-soft);
      color: #fff;
      border: 1px solid rgba(59, 130, 246, 0.35);
    }

    .badge-running {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 99px;
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      flex-shrink: 0;
    }

    /* 主内容区 */
    .main-area {
      flex: 1;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .tab-pane {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .tab-pane.active {
      display: flex;
    }

    /* 消息气泡与思考卡片 */
    .msg-user {
      align-self: flex-end;
      max-width: 86%;
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      color: #fff;
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
      font-size: 14.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg-ai {
      align-self: flex-start;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14.5px;
      line-height: 1.6;
      word-break: break-word;
    }

    .thinking-box {
      background: rgba(15, 23, 42, 0.65);
      border-left: 3px solid var(--purple);
      border-radius: 6px;
      padding: 7px 10px;
      margin-bottom: 8px;
      font-size: 12.5px;
      color: #94a3b8;
    }
    .thinking-box summary {
      cursor: pointer;
      font-weight: 500;
      color: #c4b5fd;
      user-select: none;
    }
    .thinking-content {
      margin-top: 6px;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
    }

    .tool-pill {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid var(--border);
      color: #94a3b8;
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 交互式权限审批 / Proceed / 多选题 悬浮面板 */
    .approval-banner {
      margin: 0 12px 8px;
      padding: 14px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.98), rgba(15, 23, 42, 0.98));
      border: 1.5px solid var(--orange);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 25;
    }
    .approval-banner.visible {
      display: flex;
    }
    .approval-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .approval-code {
      background: #090c10;
      padding: 8px 10px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px;
      color: #e2e8f0;
      overflow-x: auto;
      max-height: 120px;
      white-space: pre-wrap;
    }
    .approval-actions {
      display: flex;
      gap: 8px;
    }
    .btn-approve {
      flex: 1;
      padding: 9px 12px;
      border-radius: 9px;
      border: none;
      background: var(--green);
      color: #052e16;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-reject {
      flex: 1;
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid rgba(239, 68, 68, 0.5);
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    /* 快捷斜杠命令条与底部输入栏 */
    .composer-wrap {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 8px 12px calc(var(--safe-bottom) + 6px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slash-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .slash-bar::-webkit-scrollbar {
      display: none;
    }

    .chip {
      padding: 4px 10px;
      border-radius: 99px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: #93c5fd;
      font-size: 11.5px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }
    .chip.stop-btn {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      font-weight: 600;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 15px;
      max-height: 110px;
      min-height: 40px;
      resize: none;
      outline: none;
      font-family: inherit;
    }
    .chat-input:focus {
      border-color: var(--accent);
    }

    .btn-send {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 底部导航 Tab 栏 */
    .bottom-tabs {
      display: flex;
      background: rgba(18, 23, 34, 0.95);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
    }
    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-sub);
      font-size: 11px;
      background: none;
      border: none;
      cursor: pointer;
    }
    .tab-btn.active {
      color: var(--accent);
      font-weight: 600;
    }

    /* 卡片通用样式 (Diff / Artifact / Tailscale) */
    .info-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .code-pre {
      background: #080b10;
      border-radius: 8px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      overflow-x: auto;
      white-space: pre-wrap;
      color: #cbd5e1;
      max-height: 360px;
    }
  </style>
</head>
<body>
  <!-- 顶部栏 -->
  <header class="topbar">
    <button class="icon-btn" id="btnOpenDrawer" title="会话列表">☰</button>
    <div class="title-area">
      <div class="convo-title" id="currentConvoTitle">正在连接 Antigravity...</div>
      <div class="net-subtitle">
        <span class="status-dot" id="netDot"></span>
        <span id="netStatusText">探测网络与 Tailscale...</span>
      </div>
    </div>
    <select class="model-select" id="modelSelect" title="切换模型">
      <option value="">默认模型</option>
    </select>
  </header>

  <!-- 侧边抽屉 -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-header">
      <div style="font-weight: 700; font-size: 15px;">Antigravity 工作区与会话</div>
      <button class="icon-btn" id="btnCloseDrawer" style="width:30px;height:30px;">✕</button>
    </div>
    <button class="btn-new-chat" id="btnNewChat">＋ 在当前工作区新建对话</button>
    <div class="project-list" id="projectList"></div>
  </aside>

  <!-- 主视口 -->
  <main class="main-area">
    <!-- Tab 1: 实时对话流 -->
    <section class="tab-pane active" id="pane-chat"></section>

    <!-- Tab 2: 代码变更 Diffs -->
    <section class="tab-pane" id="pane-diffs"></section>

    <!-- Tab 3: Artifacts 文档预览 -->
    <section class="tab-pane" id="pane-artifacts"></section>

    <!-- Tab 4: Tailscale 网络与远程终端 -->
    <section class="tab-pane" id="pane-net"></section>

    <!-- 交互式审批浮层 (Approve / Reject / Proceed / AskQuestion) -->
    <div class="approval-banner" id="approvalBanner"></div>
  </main>

  <!-- 输入区 (仅在 Chat Tab 显示) -->
  <div class="composer-wrap" id="composerWrap">
    <div class="slash-bar">
      <button class="chip stop-btn" id="btnStopAgent" style="display:none;">⏹ 停止生成 (Stop)</button>
      <button class="chip" data-slash="/plan ">📐 /plan 规划</button>
      <button class="chip" data-slash="/boost ">🚀 /boost 深度</button>
      <button class="chip" data-slash="/goal ">🎯 /goal 持续目标</button>
      <button class="chip" data-slash="/compact ">🧹 /compact 压缩</button>
      <button class="chip" data-slash="请继续并执行验证">▶ 继续执行</button>
    </div>
    <div class="input-row">
      <textarea class="chat-input" id="chatInput" rows="1" placeholder="输入指令远程控制电脑上的 Antigravity..."></textarea>
      <button class="btn-send" id="btnSend">↑</button>
    </div>
  </div>

  <!-- 底部 Tab 导航 -->
  <nav class="bottom-tabs">
    <button class="tab-btn active" data-tab="chat">
      <span>💬</span>
      <span>实时对话</span>
    </button>
    <button class="tab-btn" data-tab="diffs">
      <span>📝</span>
      <span id="tabDiffsLabel">代码变更</span>
    </button>
    <button class="tab-btn" data-tab="artifacts">
      <span>📄</span>
      <span id="tabArtifactsLabel">方案文档</span>
    </button>
    <button class="tab-btn" data-tab="net">
      <span>🌐</span>
      <span>Tailscale/终端</span>
    </button>
  </nav>

  <script src="/app.js"></script>
</body>
</html>
